name: 🌶️ Deploy ChiliForge → Hostinger
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build React
        run: npm run build

      # ── Deploy dist/ → public_html/ ──────────────────────
      # Conexão idêntica à original que funcionava (FTP simples).
      # Correções mantidas: caminho public_html/ e proteção de db.php/.env/projects.
      - name: Deploy dist/ → public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            api/**
            projects/**
            db.php

      # ── Deploy api/ → public_html/api/ ───────────────────
      # NUNCA toca em db.php nem .env
      - name: Deploy api/ → public_html/api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: public_html/api/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            db.php
            **/db.php
            .env
            **/.env
            projects/**
