name: 🌶️ Deploy ChiliForge → Hostinger

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── 3. Instala dependências ───────────────────────────
      - name: Instalar dependências
        run: npm ci

      # ── 4. Build React ────────────────────────────────────
      - name: Build React
        run: npm run build

      # ── 5. Deploy dist/ → public_html/ ───────────────────
      # public/projects/ e .env nunca são tocados
      - name: Deploy dist/ → public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/public/projects/**
            **/.env
          dangerous-clean-slate: false

      # ── 6. Deploy api/ → public_html/api/ ────────────────
      # .env nunca é tocado
      - name: Deploy api/ → public_html/api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: /api/
          exclude: |
            **/.env
          dangerous-clean-slate: false
