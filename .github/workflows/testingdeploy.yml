name: 🌶️ Deploy ChiliForge → Hostinger
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # ── Deploy via lftp ──────────────────────────────────
      # PRE-REQUISITO: a conta FTP usada deve ter o diretório
      # apontado para public_html no hPanel. Assim o login JA cai
      # dentro do public_html e o mirror vai para ./ (= public_html).
      # NUNCA toca em: api/db.php, .env, projects/
      - name: Deploy → public_html via lftp
        env:
          FTP_HOST: 195.35.41.130
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow false;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";

            # Mostra onde caiu (deve ser o public_html)
            pwd;

            # 1) Frontend (dist/) -> raiz do login (= public_html)
            #    --delete limpa o que sumiu do build, mas os exclude
            #    protegem api/, projects/, .env e db.php de envio E remocao.
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude '^api/' \
              --exclude '^projects/' \
              --exclude '^db\.php\$' \
              --exclude '^\.env\$' \
              dist/ ./ ;

            # 2) API (api/) -> ./api/  (sem --delete por seguranca)
            mirror --reverse --verbose --parallel=4 \
              --exclude '^db\.php\$' \
              --exclude '^\.env\$' \
              --exclude '^projects/' \
              api/ api/ ;

            bye;
          "
