name: 🌶️ Deploy ChiliForge → Hostinger
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build React
        run: npm run build
        env:
          # Variáveis VITE_ precisam existir no BUILD (o Vite as embute no bundle).
          # Sem isso o app quebra com "supabaseUrl is required".
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # ── Deploy via lftp ──────────────────────────────────
      # PRE-REQUISITO: conta FTP apontada para public_html no hPanel.
      # NUNCA toca em: api/db.php, .env, projects/
      - name: Deploy → public_html via lftp
        env:
          FTP_HOST: 195.35.41.130
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force false;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";

            # Mostra onde caiu (deve ser o public_html)
            pwd;

            # 1) Frontend (dist/) -> raiz do login (= public_html)
            mirror --reverse --delete --verbose \
              --exclude '^api/' \
              --exclude '^projects/' \
              --exclude '^db\.php\$' \
              --exclude '^\.env\$' \
              dist/ ./ ;

            # 2) API (api/) -> ./api/  (sem --delete por seguranca)
            mirror --reverse --verbose \
              --exclude '^db\.php\$' \
              --exclude '^\.env\$' \
              --exclude '^projects/' \
              api/ api/ ;

            bye;
          "
