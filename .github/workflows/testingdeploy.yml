name: 🌶️ Deploy ChiliForge → Hostinger
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build React
        run: npm run build

      # ── Deploy dist/ → raiz do site ──────────────────────
      # IMPORTANTE: server-dir é relativo a onde o FTP "cai" ao logar.
      #   - Se a conta FTP cai DENTRO de public_html  → use ./
      #   - Se a conta FTP cai na HOME da conta        → use public_html/
      - name: Deploy dist/ → public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            api/**
            projects/**
            db.php

      # ── Deploy api/ → public_html/api/ ───────────────────
      # NUNCA toca em db.php nem .env
      - name: Deploy api/ → public_html/api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.41.130
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: ./api/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            db.php
            **/db.php
            .env
            **/.env
            projects/**
